<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Editor Titik Reklame Koridor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{--bg:#0f1210;--panel:#171b18;--panel2:#1e2420;--line:#2a322c;--ink:#e9ede8;
--dim:#8b968c;--lime:#c8e64f;--rust:#e0703b;--sky:#5fb3c9;--gold:#e0a15f;--vio:#b48ce8;
--mono:'JetBrains Mono','Courier New',monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
#app{display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);
display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:14.5px;margin:0}
header .sub{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:2px}
.hstat{display:flex;gap:14px;align-items:center}
.hstat div.s{text-align:right}.hstat .n{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--lime)}
.hstat .l{font-size:8px;color:var(--dim);text-transform:uppercase}
#saveInd{font-family:var(--mono);font-size:9.5px;padding:3px 8px;border-radius:10px;
background:rgba(200,230,79,.13);color:var(--lime)}
#body{display:flex;flex:1;min-height:0}
#side{width:340px;min-width:305px;background:var(--panel);border-right:1px solid var(--line);
display:flex;flex-direction:column;overflow:hidden}
.tools{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.btn{padding:7px 9px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);
color:var(--ink);font-size:11.5px;cursor:pointer;font-family:Arial;text-align:left}
.btn:hover{border-color:var(--dim)}
.btn.on{background:rgba(200,230,79,.15);border-color:var(--lime);color:var(--lime)}
.btn.ruler.on{background:rgba(180,140,232,.15);border-color:var(--vio);color:var(--vio)}
.btn.danger:hover{border-color:var(--rust);color:var(--rust)}
.grp{display:flex;gap:5px}.grp .btn{flex:1;text-align:center}
select.jsel{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
border-radius:5px;padding:6px 8px;font-size:11.5px}
.lbl{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:-2px}
.legend{padding:8px 11px;border-bottom:1px solid var(--line);font-size:10px;display:flex;
flex-direction:column;gap:4px}
.lrow{display:flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;flex-shrink:0}
.ln{width:20px;height:3px;border-radius:2px;flex-shrink:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:8px;text-align:center;font-size:11.5px;font-weight:700;cursor:pointer;
color:var(--dim);border-bottom:2px solid transparent}
.tab.act{color:var(--lime);border-color:var(--lime)}
#list,#listShort{flex:1;overflow-y:auto;padding:5px 0;display:none}
#list.show,#listShort.show{display:block}
.card{margin:5px 9px;padding:8px 10px;border:1px solid var(--line);border-radius:5px;
background:var(--panel2);cursor:pointer;font-size:10.5px}
.card:hover{border-color:var(--dim)}.card.sel{border-color:var(--lime);background:rgba(200,230,79,.08)}
.card .t{font-family:var(--mono);font-weight:700;font-size:10.5px;margin-bottom:2px}
.card .m{color:var(--dim);line-height:1.4}
.card .del{float:right;color:var(--rust);cursor:pointer;font-weight:700;padding:0 3px}
.badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:4px}
#map{flex:1}#map.adding{cursor:crosshair}#map.measuring{cursor:crosshair}
.leaflet-popup-content-wrapper{background:var(--panel2);color:var(--ink);border-radius:5px}
.leaflet-popup-tip{background:var(--panel2)}
.pp{font-size:11px;line-height:1.6}.pp b{color:var(--ink)}
footer{padding:6px 11px;font-family:var(--mono);font-size:9px;color:var(--dim);border-top:1px solid var(--line)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
@media(max-width:760px){#body{flex-direction:column}#side{width:100%;height:46%;
border-right:none;border-bottom:1px solid var(--line)}#map{height:54%}}
</style></head><body><div id="app">
<header><div><h1>Editor Titik Reklame Koridor</h1>
<div class="sub">drag geser &middot; klik tambah &middot; auto-save di browser</div></div>
<div class="hstat">
<div class="s"><div class="n" id="nT">0</div><div class="l">Titik</div></div>
<div class="s"><div class="n" id="nS">0</div><div class="l">Ruas Pendek</div></div>
<span id="saveInd">tersimpan</span>
</div></header>
<div id="body"><div id="side">
<div class="tools">
<div class="lbl">Jenis titik baru</div>
<select class="jsel" id="jType">
<option value="Koridor|Sisi Jalan">Koridor — Sisi Jalan</option>
<option value="Koridor|Halte">Koridor — Halte</option>
<option value="Koridor|JPO">Koridor — JPO</option>
<option value="Persimpangan|Tidak Bersinyal">Persimpangan — Tidak Bersinyal</option>
<option value="Persimpangan|Bersinyal (ATCS)">Persimpangan — Bersinyal (ATCS)</option>
<option value="Persimpangan|Bersinyal (OSM)">Persimpangan — Bersinyal (OSM)</option>
<option value="Persimpangan|Bersinyal (ATCS + OSM)">Persimpangan — Bersinyal (ATCS+OSM)</option>
<option value="Persimpangan|Banner Vertikal">Persimpangan — Banner Vertikal</option>
<option value="Pedestrian|Pole Light">Pedestrian — Pole Light</option>
<option value="Pedestrian|Free Standing">Pedestrian — Free Standing</option>
</select>
<button class="btn" id="bAdd">➕ Mode Tambah Titik</button>
<button class="btn ruler" id="bRuler">📏 Penggaris (multipoint)</button>
<div class="grp"><button class="btn" id="bUndo">↶ Undo</button>
<button class="btn danger" id="bReset">⟲ Reset</button></div>
<div class="grp"><button class="btn" id="bGeo">⬇ GeoJSON</button>
<button class="btn" id="bCsv">⬇ CSV</button></div>
<div class="grp"><button class="btn" id="bSave">💾 Simpan File</button>
<button class="btn" id="bLoad">📂 Muat File</button></div>
<input type="file" id="fIn" accept=".json,.geojson" style="display:none">
</div>
<div class="legend">
<div class="lrow"><span class="dot" style="background:#c8e64f"></span> Titik hasil plotting</div>
<div class="lrow"><span class="dot" style="background:#e0a15f"></span> Titik tambahan manual</div>
<div class="lrow"><span class="ln" style="background:#5fb3c9"></span> Ruas sudah ada titik</div>
<div class="lrow"><span class="ln" style="background:#e0703b"></span> Ruas pendek (&lt;1 km, belum ada titik)</div>
</div>
<div class="tabs"><div class="tab act" data-t="pts">TITIK (<span id="cT">0</span>)</div>
<div class="tab" data-t="short">RUAS PENDEK (<span id="cS">0</span>)</div></div>
<div id="list" class="show"></div><div id="listShort"></div>
<footer id="ft"></footer></div>
<div id="map"></div></div></div>

    if(s){const d=JSON.parse(s); P=d.points; nextId=d.nextId; return true;}}catch(e){}
  P=JSON.parse(JSON.stringify(ORIG)); nextId=Math.max(...P.map(p=>p.id))+1; return false;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({points:P,nextId,ts:Date.now()}));
    const i=document.getElementById('saveInd');
    i.textContent='tersimpan ✓'; i.style.opacity=1;
    setTimeout(()=>i.style.opacity=.5,1200);}catch(e){}
}
const restored=load();

const map=L.map('map').setView([1.08,104.00],12);
L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
{maxZoom:21,subdomains:['mt0','mt1','mt2','mt3'],attribution:'&copy; Google'}).addTo(map);

// ruas jalan
const roadLayer=L.layerGroup().addTo(map);
const shortIdx=[...new Set(LINES.filter(l=>l.short).map(l=>l.idx))];
LINES.forEach(l=>{
  L.polyline(l.coords,{color:l.short?'#e0703b':'#5fb3c9',weight:l.short?3.5:2.5,
    opacity:l.short?.95:.6,dashArray:l.short?'8,5':null}).addTo(roadLayer)
   .bindPopup(`<div class="pp"><b>${l.nama}</b><br>Panjang: ${l.len} m<br>
   Lebar perkerasan: ${l.lbr} m<br>${l.short?'<b style="color:#e0703b">Ruas pendek — belum ada titik</b>':''}</div>`);
});

// ===== PENGGARIS MULTIPOINT =====
let rPts=[], rLayer=L.layerGroup().addTo(map);
function haversine(a,b){const R=6371000,t=Math.PI/180;
  const dLat=(b[0]-a[0])*t,dLon=(b[1]-a[1])*t;
  const x=Math.sin(dLat/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));}
function drawRuler(){
  rLayer.clearLayers();
  if(rPts.length===0)return;
  let tot=0;
  for(let i=1;i<rPts.length;i++){
    const d=haversine(rPts[i-1],rPts[i]); tot+=d;
    L.polyline([rPts[i-1],rPts[i]],{color:'#b48ce8',weight:3,dashArray:'6,4'}).addTo(rLayer);
    const m=[(rPts[i-1][0]+rPts[i][0])/2,(rPts[i-1][1]+rPts[i][1])/2];
    L.marker(m,{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],
      html:`<div style="transform:translate(-50%,-50%);background:#0f1210dd;color:#b48ce8;
      border:1px solid #b48ce8;font:700 10px Arial;padding:1px 5px;border-radius:8px;
      white-space:nowrap">${d.toFixed(1)} m</div>`})}).addTo(rLayer);
  }
  rPts.forEach((p,i)=>{
    L.circleMarker(p,{radius:5,color:'#fff',weight:2,fillColor:'#b48ce8',fillOpacity:1}).addTo(rLayer);});
  if(rPts.length>1){
    L.marker(rPts[rPts.length-1],{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],
      html:`<div style="transform:translate(-50%,-32px);background:#b48ce8;color:#1a1030;
      font:700 11px Arial;padding:3px 8px;border-radius:10px;white-space:nowrap">
      TOTAL ${tot.toFixed(1)} m</div>`})}).addTo(rLayer);}
}

// ===== TITIK =====
const mk={};
function snap(){hist.push(JSON.stringify(P)); if(hist.length>60)hist.shift();}
function color(p){return p.manual?'#e0a15f':'#c8e64f';}

function draw(){
  Object.values(mk).forEach(m=>map.removeLayer(m));
  for(const k in mk)delete mk[k];
  P.forEach(p=>{
    const m=L.marker([p.lat,p.lon],{draggable:true,
      icon:L.divIcon({className:'',iconSize:[16,16],iconAnchor:[8,8],
      html:`<div style="width:14px;height:14px;border-radius:50%;background:${color(p)};
      border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.6)"></div>`})}).addTo(map);
    m.bindPopup(`<div class="pp"><b>Titik #${p.id}</b><br>
      <b>${p.jenis||'Koridor'}</b> — ${p.tipe||'Sisi Jalan'}<br>
      ${p.jalan}<br>${p.kel}, ${p.kec}<br>
      ${p.lbr?`Lebar ${p.lbr} m · offset ${p.off} m (${p.sisi})<br>`:''}
      <span style="font-family:monospace;font-size:10px">${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</span></div>`);
    m.on('dragstart',()=>snap());
    m.on('dragend',e=>{const ll=e.target.getLatLng();
      p.lat=+ll.lat.toFixed(6);p.lon=+ll.lng.toFixed(6);save();render();});
    m.on('click',()=>{sel=p.id;render();});
    mk[p.id]=m;
  });
}

function render(){
  draw();
  const le=document.getElementById('list');le.innerHTML='';
  P.slice().sort((a,b)=>a.id-b.id).forEach(p=>{
    const c=document.createElement('div');
    c.className='card'+(sel===p.id?' sel':'');
    const bg=p.manual?'rgba(224,161,95,.2);color:#e0a15f':'rgba(200,230,79,.16);color:#c8e64f';
    c.innerHTML=`<span class="del" data-id="${p.id}">✕</span>
      <div class="t">#${p.id}<span class="badge" style="background:${bg}">${p.tipe||'Sisi Jalan'}</span></div>
      <div class="m">${p.jalan}<br>${p.kel}, ${p.kec}</div>`;
    c.onclick=e=>{
      if(e.target.classList.contains('del')){snap();P=P.filter(x=>x.id!=p.id);save();render();return;}
      sel=p.id;map.setView([p.lat,p.lon],18);mk[p.id].openPopup();render();};
    le.appendChild(c);});

  const ls=document.getElementById('listShort');ls.innerHTML='';
  const seen=new Set();
  LINES.filter(l=>l.short).forEach(l=>{
    if(seen.has(l.idx))return; seen.add(l.idx);
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="t" style="color:#e0703b">Ruas #${l.idx}</div>
      <div class="m">${l.nama}<br>Panjang ${l.len} m · lebar ${l.lbr} m</div>`;
    c.onclick=()=>{map.fitBounds(L.latLngBounds(l.coords).pad(.3));};
    ls.appendChild(c);});

  document.getElementById('nT').textContent=P.length;
  document.getElementById('nS').textContent=shortIdx.length;
  document.getElementById('cT').textContent=P.length;
  document.getElementById('cS').textContent=shortIdx.length;
  document.getElementById('ft').textContent=`${P.length} titik · ${hist.length} undo · auto-save aktif`;
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('act'));
  t.classList.add('act');
  document.getElementById('list').classList.toggle('show',t.dataset.t==='pts');
  document.getElementById('listShort').classList.toggle('show',t.dataset.t==='short');});

document.getElementById('bAdd').onclick=function(){
  addMode=!addMode; if(addMode){rulerMode=false;
    document.getElementById('bRuler').classList.remove('on');
    document.getElementById('map').classList.remove('measuring');}
  this.classList.toggle('on',addMode);
  document.getElementById('map').classList.toggle('adding',addMode);
  this.textContent=addMode?'✓ Klik di peta...':'➕ Mode Tambah Titik';};

document.getElementById('bRuler').onclick=function(){
  rulerMode=!rulerMode; if(rulerMode){addMode=false;
    document.getElementById('bAdd').classList.remove('on');
    document.getElementById('bAdd').textContent='➕ Mode Tambah Titik';
    document.getElementById('map').classList.remove('adding');}
  else{rPts=[];drawRuler();}
  this.classList.toggle('on',rulerMode);
  document.getElementById('map').classList.toggle('measuring',rulerMode);
  this.textContent=rulerMode?'✓ Klik titik-titik... (klik lagi utk selesai)':'📏 Penggaris (multipoint)';};

map.on('click',e=>{
  if(rulerMode){rPts.push([e.latlng.lat,e.latlng.lng]);drawRuler();return;}
  if(!addMode)return;
  snap();
  const [jn,tp]=document.getElementById('jType').value.split('|');
  P.push({id:nextId++,lon:+e.latlng.lng.toFixed(6),lat:+e.latlng.lat.toFixed(6),
    jenis:jn,tipe:tp,jalan:'(manual)',kel:'-',kec:'-',lbr:0,off:0,sisi:'-',
    ruas:999,urut:0,manual:true});
  save();render();});

document.getElementById('bUndo').onclick=()=>{
  if(hist.length){P=JSON.parse(hist.pop());save();render();}};
document.getElementById('bReset').onclick=()=>{
  if(confirm('Kembalikan ke hasil plotting awal? Semua editan hilang.')){
    snap();P=JSON.parse(JSON.stringify(ORIG));nextId=Math.max(...P.map(p=>p.id))+1;
    save();render();}};

function dl(n,c,t){const b=new Blob([c],{type:t});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}

function geojson(){return {type:'FeatureCollection',
  crs:{type:'name',properties:{name:'urn:ogc:def:crs:OGC:1.3:CRS84'}},
  features:P.map(p=>({type:'Feature',geometry:{type:'Point',coordinates:[p.lon,p.lat]},
    properties:{ID:p.id,JENIS:p.jenis||'Koridor',TIPE:p.tipe||'Sisi Jalan',
      NAMA_JALAN:p.jalan,KELURAHAN:p.kel,KECAMATAN:p.kec,LBR_KERAS:p.lbr,
      OFFSET_M:p.off,SISI:p.sisi,RUAS_IDX:p.ruas,URUT:p.urut,
      SUMBER:p.manual?'MANUAL':'PLOTTING',STATUS:'DRAFT'}}))};}

document.getElementById('bGeo').onclick=()=>
  dl('Titik_Koridor_Baru.geojson',JSON.stringify(geojson(),null,1),'application/geo+json');
document.getElementById('bCsv').onclick=()=>{
  const h='ID,JENIS,TIPE,NAMA_JALAN,KELURAHAN,KECAMATAN,LBR_KERAS,OFFSET_M,SISI,SUMBER,longitude,latitude';
  const r=P.map(p=>[p.id,p.jenis||'Koridor',p.tipe||'Sisi Jalan',`"${p.jalan}"`,`"${p.kel}"`,
    `"${p.kec}"`,p.lbr,p.off,p.sisi,p.manual?'MANUAL':'PLOTTING',p.lon,p.lat].join(','));
  dl('Titik_Koridor_Baru.csv',[h,...r].join('\n'),'text/csv');};

document.getElementById('bSave').onclick=()=>
  dl('proyek_reklame.json',JSON.stringify({points:P,nextId,ts:Date.now()}),'application/json');
document.getElementById('bLoad').onclick=()=>document.getElementById('fIn').click();
document.getElementById('fIn').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
    if(d.points){snap();P=d.points;nextId=d.nextId||Math.max(...P.map(p=>p.id))+1;}
    else if(d.features){snap();P=d.features.map((f,i)=>({id:f.properties.ID||i+1,
      lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1],
      jenis:f.properties.JENIS,tipe:f.properties.TIPE,jalan:f.properties.NAMA_JALAN,
      kel:f.properties.KELURAHAN,kec:f.properties.KECAMATAN,lbr:f.properties.LBR_KERAS||0,
      off:f.properties.OFFSET_M||0,sisi:f.properties.SISI||'-',ruas:f.properties.RUAS_IDX||999,
      urut:f.properties.URUT||0,manual:f.properties.SUMBER==='MANUAL'}));
      nextId=Math.max(...P.map(p=>p.id))+1;}
    save();render();alert('Berhasil dimuat: '+P.length+' titik');}
    catch(err){alert('File tidak valid');}};
  r.readAsText(f); e.target.value='';};

render();
map.fitBounds(L.latLngBounds(P.map(p=>[p.lat,p.lon])).pad(.15));
if(restored)setTimeout(()=>{document.getElementById('saveInd').textContent='progres dipulihkan ✓';},400);
</script></body></html>
